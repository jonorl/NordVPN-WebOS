name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ShellCheck is preinstalled on the runner; .shellcheckrc sets POSIX sh, as the router runs BusyBox ash.
      - run: shellcheck router/*.sh tools/*.sh
